<div class="d-flex flex-column align-items-center mb-4">
    <app-header></app-header>
</div>

<div class="d-flex justify-content-center mt-4">
    <div class="col-lg-9 col-md-10 col-12 contenedor-listado">
        <div class="card">
            <div class="card-header bg-primary text-white text-center">
                <h4 class="mb-0 font-weight-bold">EVALUACIÓN</h4>
            </div>

            <div class="card-body">
                <form (ngSubmit)="guardarCabecera()">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="fechaEvaluacion">Fecha de Evaluación</label>
                            <input type="date" id="fechaEvaluacion" class="form-control"
                                   [(ngModel)]="evaluacionCabecera.fechaMod" name="fechaMod" required />
                        </div>

                        <div class="col-md-6 mb-3">
                            <label for="periodo">Período</label>
                            <input type="date" id="periodo" class="form-control"
                                   [(ngModel)]="evaluacionCabecera.periodo" name="periodo" required />
                        </div>

                        <div class="col-md-6 mb-3">
                            <label>Agente Evaluador</label>
                            <input type="text" class="form-control" [value]="nombreAgenteEvaluador" disabled />
                            <input type="hidden" [(ngModel)]="evaluacionCabecera.agenteevaluador.nombreUsuarioEvaluador"
                                   name="nombreUsuarioEvaluador" />
                        </div>

                        <div class="col-md-6 mb-3">
                            <label>Efector</label>
                            <input type="text" class="form-control" [value]="efectorNombre" disabled />
                            <input type="hidden" [(ngModel)]="evaluacionCabecera.Efector.idEfector" name="idEfector" />
                        </div>

                        <div class="col-md-6 mb-3">
                            <label>Servicio</label>
                            <input type="text" class="form-control" [value]="servicioNombre" disabled />
                            <input type="hidden" [(ngModel)]="evaluacionCabecera.Servicio.idServicio"
                                   name="idServicio" />
                        </div>
                    </div>

                    <div class="d-flex justify-content-end mt-3">
                        <button type="submit" class="btn btn-success" [disabled]="isLoading">
                            <span *ngIf="isLoading" class="spinner-border spinner-border-sm"></span>
                            {{ isLoading ? 'Cargando...' : 'Guardar y agrega agente' }}
                        </button>
                    </div>
                </form>
            </div> <!-- Cierre correcto de card-body -->
        </div>
    </div>
</div>



<!-- Modal personalizado con fondo -->
<div *ngIf="mostrarModal" class="modal-backdrop-custom">
    <div class="custom-modal">
        <div class="custom-modal-header">
            <h5 class="modal-title">✅ Seleccione agente para evaluar</h5>
            <button type="button" class="close" (click)="mostrarModal = false">
                <span>&times;</span>
            </button>
        </div>
        <div class="custom-modal-body">

            <!-- Selector para elegir entre nombre y legajo -->
            <div class="form-group mb-2">
                <label class="form-label mb-1">Buscar por:</label>
                <div class="d-flex gap-2">
                    <select id="tipoBusqueda" class="form-control form-control-sm" [(ngModel)]="tipoBusqueda"
                            name="tipoBusqueda" style="width: 120px;">
                        <option value="nombre">Nombre</option>
                        <option value="legajo">Legajo</option>
                    </select>
                    <input type="text" [(ngModel)]="filtroAgente" class="form-control form-control-sm"
                           placeholder="Buscar..." />

                </div>
            </div>



            <!-- Input de mensaje -->

            <div *ngIf="isLoadingAgentes" class="alert alert-info text-center">
                <strong>Cargando agentes...</strong> Por favor, espere.
            </div>

            <!-- Tabla de agentes dentro del modal -->
            <div class="mt-4">

                <div class="scrollable-table mt-2">
                    <table class="table table-striped table-bordered table-hover">
                        <thead class="thead-dark">
                            <tr>
                                <th>id</th>
                                <th>Nombre</th>
                                <th>Legajo</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr *ngFor="let agente of agentesFiltrados">
                                <td>{{ agente._id }}</td>
                                <td>{{ agente.nombre }}</td>
                                <td>{{ agente.legajo }}</td>
                                <td>
                                    <button class="btn btn-sm btn-primary"
                                            (click)="evaluarAgente(agente)">Evaluar</button>
                                </td>
                            </tr>
                            <tr *ngIf="agentesDisponibles.length === 0">
                                <td colspan="4" class="text-center">No hay agentes disponibles.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <div class="custom-modal-footer text-end">
            <button class="btn btn-secondary" (click)="mostrarModal = false">Cerrar</button>
        </div>
    </div>
</div>
