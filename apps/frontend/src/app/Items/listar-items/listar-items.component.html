<app-header></app-header>
<div class="contenedor-principal">
    <app-comunes class="menu-horizontal"></app-comunes>

    <div class="container-fluid mt-4 px-5">
        <div class="row">
            <div class="col-12">
                <div class="card">
                    <div class="card-body">
                        <div class="text-center mb-4">
                            <h2 class="m-0">Items</h2>
                        </div>

                        <div class="d-flex justify-content-end mb-3">
                            <button class="btn btn-success" (click)="abrirModal()">
                                <i class="fas fa-plus me-2"></i>NUEVA
                            </button>
                        </div>

                        <table class="table table-striped">
                            <thead>
                                <tr>
                                    <th>Descripción</th>
                                    <th>Valor</th>
                                    <th class="text-center">Acciones</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr *ngFor="let item of listaItems">
                                    <td>{{ item.descripcion }}</td>
                                    <td>{{ item.valor }}</td>
                                    <td class="text-center">
                                        <button class="btn btn-primary btn-sm me-2" (click)="editarItem(item)">
                                            <i class="fas fa-edit"></i>
                                        </button>
                                        <button class="btn btn-danger btn-sm" (click)="eliminarItem(item._id!)">
                                            <i class="fas fa-trash"></i>
                                        </button>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- Modal personalizado -->
                <div *ngIf="mostrarModal" class="modal-overlay">
                    <div class="modal-custom">
                        <div class="modal-header d-flex justify-content-between align-items-center">
                            <h5 class="modal-title">{{ modoEdicion ? 'Editar Ítem' : 'Nuevo Ítem' }}</h5>
                            <button type="button" class="btn-close" (click)="cerrarModal()"></button>
                        </div>

                        <div class="modal-body">
                            <form (ngSubmit)="guardarItem()" #formItem="ngForm">
                                <div class="mb-3">
                                    <label for="descripcion" class="form-label">Descripción</label>
                                    <input type="text" id="descripcion" name="descripcion" class="form-control"
                                           [(ngModel)]="itemSeleccionado.descripcion" required>
                                </div>

                                <div class="mb-3">
                                    <label for="valor" class="form-label">Valor</label>
                                    <input type="number" id="valor" name="valor" class="form-control"
                                           [(ngModel)]="itemSeleccionado.valor" required>
                                </div>

                                <div class="modal-footer d-flex justify-content-end">
                                    <button type="submit" class="btn btn-primary" [disabled]="formItem.invalid">
                                        {{ modoEdicion ? 'Actualizar' : 'Guardar' }}
                                    </button>
                                    <button type="button" class="btn btn-secondary ms-2"
                                            (click)="cerrarModal()">Cancelar</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
                <!-- Fin Modal -->
            </div>
        </div>
    </div>
</div>
