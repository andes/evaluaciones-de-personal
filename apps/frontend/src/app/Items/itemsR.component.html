<app-header></app-header>

<div class="contenedor-principal">
    <app-comunes class="menu-horizontal"></app-comunes>

    <div class="contenido">
        <div class="container-fluid">
            <div class="row justify-content-center">
                <div class="col-lg-10">
                    <div class="card">
                        <div class="card-body">

                            <!-- Header con botón -->
                            <div class="mb-4">
                                <div class="text-center">
                                    <h2 class="m-0">ItemsR</h2>
                                </div>

                                <div class="d-flex justify-content-end mt-3">
                                    <button class="btn btn-success" (click)="abrirModal()">NUEVO</button>
                                </div>
                            </div>

                            <!-- Tabla -->
                            <div class="table-responsive">
                                <table class="table table-striped w-100" *ngIf="listaItemsR.length > 0; else sinDatos">
                                    <thead>
                                        <tr>
                                            <th>Descripción</th>
                                            <th>Valor</th>
                                            <th></th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr *ngFor="let item of listaItemsR">
                                            <td>{{ item.descripcion }}</td>
                                            <td>{{ item.valor }}</td>
                                            <td>
                                                <button class="btn btn-primary btn-sm" (click)="editarItemR(item)">
                                                    <i class="fas fa-edit"></i>
                                                </button>
                                                <button class="btn btn-danger btn-sm ms-2"
                                                        (click)="eliminarItemR(item._id!)">
                                                    <i class="fas fa-trash"></i>
                                                </button>
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>

                            <!-- Sin datos -->
                            <ng-template #sinDatos>
                                <h5 class="text-start mt-3">No hay ítems para mostrar</h5>
                            </ng-template>

                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Modal -->
<div *ngIf="mostrarModal" class="modal-overlay">
    <div class="modal-custom">
        <div class="modal-header d-flex justify-content-between align-items-center">
            <h5 class="modal-title">{{ modoEdicion ? 'Editar Ítem' : 'Nuevo Ítem' }}</h5>
            <button type="button" class="btn-close" (click)="cerrarModal()"></button>
        </div>

        <div class="modal-body">
            <form (ngSubmit)="guardarItemR()" #formItemR="ngForm">
                <div class="mb-3">
                    <label for="descripcion" class="form-label">Descripción</label>
                    <textarea id="descripcion" name="descripcion" rows="3" class="form-control"
                              [(ngModel)]="itemSeleccionado.descripcion" required></textarea>
                </div>

                <div class="mb-3">
                    <label for="valor" class="form-label">Valor</label>
                    <input type="number" id="valor" name="valor" class="form-control"
                           [(ngModel)]="itemSeleccionado.valor" required min="0">
                </div>

                <div class="modal-footer d-flex justify-content-end">
                    <button type="submit" class="btn btn-primary" [disabled]="formItemR.invalid">Guardar</button>
                    <button type="button" class="btn btn-secondary ms-2" (click)="cerrarModal()">Cancelar</button>
                </div>
            </form>
        </div>
    </div>
</div>
