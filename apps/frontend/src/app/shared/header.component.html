<div class="header-container">
    <div class="header">
        <h1>{{ titulo }}</h1>
        <p>{{ nombreUsuario }} – {{ rol }}</p>
    </div>

    <nav>
        <a *ngFor="let item of menuList" [routerLink]="item.route" (mouseover)="setAnimation(item.anim)">
            {{ item.label }}
        </a>

    </nav>


</div>
