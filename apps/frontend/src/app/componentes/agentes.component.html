<app-header></app-header>
<div class="contenedor-principal">
    <app-comunes class="menu-horizontal"></app-comunes>

    <div class="container-fluid mt-4 px-5">
        <div class="row">
            <div class="col-12">
                <div class="card">
                    <div class="card-body">

                        <div class="mb-4">
                            <div class="text-center">
                                <h2 class="m-0">Agentes</h2>
                            </div>


                            <div class="d-flex justify-content-end mt-3">


                                <button class="btn btn-success" (click)="abrirModal()">NUEVO</button>
                            </div>
                            <div class="mb-3 text-start" style="max-width: 300px;">
                                <input type="text" class="form-control" placeholder="Buscar por nombre..."
                                       [(ngModel)]="filtroNombre" (ngModelChange)="filtrarAgentes()" />
                            </div>
                        </div>

                        <div class="table-responsive" style="max-height: 400px; overflow-y: auto;">
                            <table class="table table-striped w-100" *ngIf="agentes.length > 0; else sinDatos">
                                <thead>
                                    <tr class="text-center">
                                        <th>Legajo</th>
                                        <th>DNI</th>
                                        <th>Nombre</th>
                                        <th></th>
                                    </tr>
                                </thead>
                                <tbody (scroll)="onScroll($event)" #scrollable>
                                    <tr *ngFor="let agente of agentes">
                                        <td class="text-start">{{ agente.legajo }}</td>
                                        <td class="text-start">{{ agente.dni }}</td>
                                        <td class="text-start">{{ agente.nombre }}</td>
                                        <td class="text-start">
                                            <button class="btn btn-primary btn-sm" (click)="editarAgente(agente)">
                                                <i class="fas fa-edit"></i>
                                            </button>
                                            <button class="btn btn-danger btn-sm ms-2"
                                                    (click)="eliminarAgente(agente._id!)">
                                                <i class="fas fa-trash"></i>
                                            </button>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>


                        <ng-template #sinDatos>
                            <h5 class="text-start mt-3">No hay agentes para mostrar</h5>
                        </ng-template>

                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Modal -->
<div *ngIf="mostrarModal" class="modal-overlay">
    <div class="modal-custom">
        <div class="modal-header d-flex justify-content-between align-items-center">
            <h5 class="modal-title">
                {{ modoEdicion ? 'Editar Agente' : 'Nuevo Agente' }}
            </h5>
            <button type="button" class="btn-close" (click)="cerrarModal()"></button>
        </div>

        <div class="modal-body">
            <form (ngSubmit)="guardarAgente()" #formAgente="ngForm">
                <div class="mb-3">
                    <label for="legajo" class="form-label">Legajo</label>
                    <input id="legajo" name="legajo" type="text" class="form-control" required
                           [(ngModel)]="agenteSeleccionado.legajo" />
                </div>

                <div class="mb-3">
                    <label for="dni" class="form-label">DNI</label>
                    <input id="dni" name="dni" type="text" class="form-control" required
                           [(ngModel)]="agenteSeleccionado.dni" />
                </div>

                <div class="mb-3">
                    <label for="nombre" class="form-label">Nombre</label>
                    <input id="nombre" name="nombre" type="text" class="form-control" required
                           [(ngModel)]="agenteSeleccionado.nombre" />
                </div>

                <div class="modal-footer d-flex justify-content-end">
                    <button type="submit" class="btn btn-primary" [disabled]="formAgente.invalid">
                        Guardar
                    </button>
                    <button type="button" class="btn btn-secondary ms-2" (click)="cerrarModal()">
                        Cancelar
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
